name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: tag 必须落在 main 上
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME 不在 main 上，拒绝发布"
            exit 1
          fi
          echo "tag 落在 main 上，允许发布"

  build:
    needs: guard
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - cmd: edge-agent
            goarch: amd64
          - cmd: proto-adapter
            goarch: amd64
          - cmd: edge-agent
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: 构建静态二进制
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/${{ matrix.cmd }}-linux-${{ matrix.goarch }}" \
            "./cmd/${{ matrix.cmd }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cmd }}-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          generate_release_notes: true