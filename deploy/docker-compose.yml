services:
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    ports:
      - "1883:1883"
    environment:
      # 选定 acl.grid / acl.internal，入口脚本按此复制到 /mosquitto/acl。
      MQTT_TOPIC_SCHEME: ${MQTT_TOPIC_SCHEME:-grid}
    # 入口脚本要 chown 容器内的 ACL 副本，故以 root 起容器、broker 仍降权到 mosquitto。
    user: "0:0"
    entrypoint: ["/mosquitto/config/entrypoint.sh"]
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:${TIMESCALEDB_VERSION}
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # init/01_schema.sql 用 \getenv 读取，建业务角色时不落明文到脚本
      WORKSHOP_ADAPTER_PASSWORD: ${WORKSHOP_ADAPTER_PASSWORD}
      WORKSHOP_DASHBOARD_PASSWORD: ${WORKSHOP_DASHBOARD_PASSWORD}
      WORKSHOP_NOTIFY_PASSWORD: ${WORKSHOP_NOTIFY_PASSWORD}
      WORKSHOP_READONLY_PASSWORD: ${WORKSHOP_READONLY_PASSWORD}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  # 通知触达层。自定义镜像只为一个 contrib 包（官方镜像不带数据库节点），
  # settings.js 与 flows.json 由卷挂进 /data：交付物要能 diff，打进镜像就看不见改了哪一行。
  node-red:
    build:
      context: ./node-red
      args:
        NODE_RED_PG_NODE_VERSION: ${NODE_RED_PG_NODE_VERSION}
    image: workshop-monitor/node-red:${NODE_RED_VERSION}
    ports:
      - "1880:1880"
    environment:
      # 4.0.5 只有一个 HTTP 监听口，编辑器与 /api/notify 共用 1880。
      PORT: "1880"
      TZ: Asia/Shanghai
      NODE_OPTIONS: --max-old-space-size=256
      # 配置域投影与投递日志都走 workshop_notify（只对 notify_log 有写权限）。
      PG_HOST: timescaledb
      PG_PORT: "5432"
      PG_DATABASE: ${POSTGRES_DB}
      PG_USER: workshop_notify
      PG_PASSWORD: ${WORKSHOP_NOTIFY_PASSWORD}
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-wecom-mock}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL}
    volumes:
      # 整个目录挂进去：编辑器「部署」要能写回 flows.json，单文件挂载会 EBUSY。
      # 运行时产物（.config.*、package.json、node_modules 等）已进 .gitignore，
      # 版本库里只该出现 flows.json 与 settings.js 两处改动。
      - ./node-red:/data
    depends_on:
      - timescaledb
    restart: unless-stopped

volumes:
  timescale-data:
  mosquitto-data:
