services:
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION}
    ports:
      - "1883:1883"
    environment:
      # 选定 acl.grid / acl.internal，入口脚本按此复制到 /mosquitto/acl。
      MQTT_TOPIC_SCHEME: ${MQTT_TOPIC_SCHEME:-grid}
    # 入口脚本要 chown 容器内的 ACL 副本，故以 root 起容器、broker 仍降权到 mosquitto。
    user: "0:0"
    entrypoint: ["/mosquitto/config/entrypoint.sh"]
    volumes:
      - ./mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:${TIMESCALEDB_VERSION}
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # init/01_schema.sql 用 \getenv 读取，建业务角色时不落明文到脚本
      WORKSHOP_ADAPTER_PASSWORD: ${WORKSHOP_ADAPTER_PASSWORD}
      WORKSHOP_DASHBOARD_PASSWORD: ${WORKSHOP_DASHBOARD_PASSWORD}
      WORKSHOP_NOTIFY_PASSWORD: ${WORKSHOP_NOTIFY_PASSWORD}
      WORKSHOP_READONLY_PASSWORD: ${WORKSHOP_READONLY_PASSWORD}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  # 通知触达层（N-01/N-02）与写视图（N-03/N-04）共用一个实例。
  # 自定义镜像只为一个 contrib 包（官方镜像不带数据库节点）；
  # settings.js 与 flows.json 由卷挂进 /data：交付物要能 diff，打进镜像就看不见改了哪一行。
  node-red:
    build:
      context: ./node-red
      args:
        NODE_RED_PG_NODE_VERSION: ${NODE_RED_PG_NODE_VERSION}
        NODE_RED_DASHBOARD_VERSION: ${NODE_RED_DASHBOARD_VERSION}
    image: workshop-monitor/node-red:${NODE_RED_VERSION}
    ports:
      - "1880:1880"
    environment:
      # 4.0.5 只有一个 HTTP 监听口，编辑器与 /api/notify 共用 1880。
      PORT: "1880"
      TZ: Asia/Shanghai
      NODE_OPTIONS: --max-old-space-size=256
      # 配置域投影与投递日志都走 workshop_notify（只对 notify_log 有写权限）。
      PG_HOST: timescaledb
      PG_PORT: "5432"
      PG_DATABASE: ${POSTGRES_DB}
      PG_USER: workshop_notify
      PG_PASSWORD: ${WORKSHOP_NOTIFY_PASSWORD}
      # N-03 告警确认走 workshop_dashboard：写权限只覆盖 alarm 与 alarm_ack。
      # 刻意与上面 notify 的角色分开——「发通知」与「改告警」必须是两个权限。
      PG_DASHBOARD_USER: workshop_dashboard
      PG_DASHBOARD_PASSWORD: ${WORKSHOP_DASHBOARD_PASSWORD}
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-wecom-mock}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL}
      # N-04 的两处跳转地址。都走环境变量：写死在流程里换环境就失效。
      # SELF_URL 指回自己（表格每 5 秒拉一次活动告警），用容器内地址。
      SELF_URL: http://127.0.0.1:1880
      # 模拟器跑在宿主机上（004 交付的是宿主机 venv 形态，见 O-13），
      # 容器里的 127.0.0.1 不是它，要用 host-gateway。
      SIM_URL: ${SIM_URL:-http://host.docker.internal:8080}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
    extra_hosts:
      # SIM_URL 指向宿主机上的模拟器。Linux 下 host.docker.internal 默认不存在，
      # 要显式映射到宿主机网关。
      - "host.docker.internal:host-gateway"
    volumes:
      # 整个目录挂进去：编辑器「部署」要能写回 flows.json，单文件挂载会 EBUSY。
      # 运行时产物（.config.*、package.json、node_modules 等）已进 .gitignore，
      # 版本库里只该出现 flows.json 与 settings.js 两处改动。
      - ./node-red:/data

  # 读视图：只读账号连库，无任何写权限。面板与数据源由 provisioning 纳管，
  # 界面里改面板不生效（allowUiUpdates=false），改动必须落到 JSON 并提交。
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    ports:
      - "3000:3000"
    environment:
      # 数据源占位符，由 provisioning/datasources/postgres.yaml 替换。
      GRAFANA_DB_HOST: timescaledb
      GRAFANA_DB_PORT: "5432"
      GRAFANA_DB_NAME: ${POSTGRES_DB}
      GRAFANA_DB_USER: workshop_readonly
      GRAFANA_DB_PASSWORD: ${WORKSHOP_READONLY_PASSWORD}
      # 只读形态：不建管理员、关登录表单，匿名访客为 Viewer，写操作一律 403。
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Shanghai
      # 时间列统一到毫秒。面板里不写 unit 覆盖：Grafana 11.3 的 getValueFormat
      # 只认 prefix/suffix/time/si/count/currency/bool 七种前缀，dateTime: 不生效。
      GF_DATE_FORMATS_FULL_DATE: "YYYY-MM-DD HH:mm:ss.SSS"
      # 刷新粒度与规则文件一致：5 秒。
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - timescaledb
    restart: unless-stopped

volumes:
  timescale-data:
  mosquitto-data:
  grafana-data:
