# 车间设备监测 —— Mosquitto 2.0.20
# 只做连接、认证、授权与消息持久化。字段转换、入库规则、规则判定一律不在这里。

listener 1883
protocol mqtt

# 匿名一律拒绝。账号来自 passwd（scripts/gen-passwd.sh 从 .env 生成，不入版本库）。
allow_anonymous false
password_file /mosquitto/config/passwd
# acl 由 compose 按 MQTT_TOPIC_SCHEME 从 acl.grid / acl.internal 挂到 /mosquitto/acl。
# 不挂在 /mosquitto/config 下：那个目录整体只读挂载，容器无法在其下建挂载点。
acl_file /mosquitto/acl

# 持久会话与离线队列。adapter 以 clean session = false 订阅，
# 重连前到达的上行不能只留在内存里。
persistence true
persistence_location /mosquitto/data/

# QoS 1 离线队列上限：单终端 5 秒一条，10000 条约 14 小时。
max_queued_messages 10000
max_inflight_messages 40

# 权限拒绝要能在 broker 日志里看到具体账号，否则现场只能猜。
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true